<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · BankOps</title>
<style>:root{color-scheme:dark;--bg:#090909;--line:rgba(255,255,255,.1);--muted:rgba(255,255,255,.5);--panel:rgba(255,255,255,.055);--good:#63d7a5;--warn:#f6c76b}*{box-sizing:border-box}body{margin:0;color:#fff;background:var(--bg);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}a{color:inherit;text-decoration:none}button,select{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:rgba(9,9,9,.85)}nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700}.nav{display:flex;gap:8px;align-items:center}.button{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:100px;color:#fff;background:var(--panel);cursor:pointer}.primary{background:#fff;color:#111;border:0}.danger{color:#ffaaa2}main{padding:48px 0 80px}h1{font-size:42px;letter-spacing:-.045em;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 28px}.filters{display:flex;gap:10px;margin-bottom:16px}.filters select{height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;color:#fff;background:#151515}.list{display:grid;gap:10px}.user{display:grid;grid-template-columns:1.4fr .8fr 1fr auto;gap:18px;align-items:center;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.user strong{display:block}.meta{color:var(--muted);font-size:11px}.badge{display:inline-flex;padding:3px 8px;border:1px solid var(--line);border-radius:100px;font-size:10px}.ACTIVE{color:var(--good)}.PENDING{color:var(--warn)}.roles{display:flex;flex-wrap:wrap;gap:5px}.role{font-size:10px;color:#bcd1ff}.actions{display:flex;gap:6px}.dialog{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.7)}.dialog.show{display:grid}.modal{width:min(650px,calc(100% - 28px));padding:25px;border:1px solid var(--line);border-radius:20px;background:#151515}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.role-grid label{padding:10px;border:1px solid var(--line);border-radius:10px}.modal select{width:100%;height:42px;padding:0 10px;color:#fff;background:#0d0d0d;border:1px solid var(--line);border-radius:10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:800px){.user{grid-template-columns:1fr}.filters{flex-wrap:wrap}}</style></head>
<body><header><nav class="shell"><a class="brand" href="/">BankOps AI Agent</a><div class="nav"><span><b data-user-name>管理员</b> · <span data-user-department></span></span><a class="button" href="/">返回工作台</a><button class="button" onclick="BankOpsAuth.logout()">退出</button></div></nav></header><main class="shell"><h1>用户与权限管理</h1><p class="lead">审批注册申请，维护七个团队归属与平台角色。所有变更都会写入身份审计日志。</p><div class="filters"><select id="status"><option value="">全部状态</option><option>PENDING</option><option>ACTIVE</option><option>DISABLED</option></select><select id="department"><option value="">全部团队</option></select><button class="button" id="refresh">刷新</button></div><div class="list" id="list">正在加载…</div></main><div class="dialog" id="dialog"><div class="modal"><h2 id="modalTitle">编辑用户</h2><label>所属团队</label><select id="editDepartment"></select><div class="role-grid" id="roleGrid"></div><div class="modal-foot"><button class="button" id="cancel">取消</button><button class="button danger" id="disable">停用</button><button class="button primary" id="save">批准并保存</button></div></div></div><script src="/auth-client.js"></script><script>
const roleNames={PLATFORM_ADMIN:'平台管理员',DEPARTMENT_ADMIN:'团队管理员',OPERATOR:'运维人员',SECURITY_AUDITOR:'安全审计员',KNOWLEDGE_MANAGER:'知识管理员',SKILL_DEVELOPER:'Skill 开发者'};let departments=[],roles=[],editing=null,currentUser=null;const list=document.getElementById('list'),dialog=document.getElementById('dialog'),statusFilter=document.getElementById('status'),departmentFilter=document.getElementById('department');async function init(){currentUser=await BankOpsAuth.me();const [deptBody,roleBody]=await Promise.all([BankOpsAuth.api('/api/v1/auth/departments'),BankOpsAuth.api('/api/v1/admin/roles')]);departments=currentUser.roles.includes('PLATFORM_ADMIN')?deptBody.departments:deptBody.departments.filter(item=>item.code===currentUser.department.code);roles=roleBody.roles;for(const select of [departmentFilter,document.getElementById('editDepartment')]){const keep=select.id==='department'?[new Option('全部团队','')]:[];select.replaceChildren(...keep,...departments.map(d=>new Option(d.name,d.code)))}document.getElementById('roleGrid').replaceChildren(...roles.map(role=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=role;label.append(input,` ${roleNames[role]||role}`);return label}));await load()}async function load(){const query=new URLSearchParams();if(statusFilter.value)query.set('status',statusFilter.value);if(departmentFilter.value)query.set('departmentCode',departmentFilter.value);const body=await BankOpsAuth.api(`/api/v1/admin/users?${query}`);list.replaceChildren(...body.users.map(renderUser))}function renderUser(user){const row=document.createElement('article');row.className='user';const identity=document.createElement('div');identity.innerHTML=`<strong></strong><span class="meta"></span>`;identity.querySelector('strong').textContent=user.displayName;identity.querySelector('.meta').textContent=`${user.username} · ${user.userId}`;const dept=document.createElement('div');dept.textContent=user.department.name;const access=document.createElement('div'),badge=document.createElement('span');badge.className=`badge ${user.status}`;badge.textContent=user.status;const roleBox=document.createElement('div');roleBox.className='roles';for(const role of user.roles){const item=document.createElement('span');item.className='role';item.textContent=roleNames[role]||role;roleBox.append(item)}access.append(badge,roleBox);const action=document.createElement('button');action.className='button';action.textContent='编辑';action.onclick=()=>open(user);row.append(identity,dept,access,action);return row}function open(user){editing=user;modalTitle.textContent=`编辑 ${user.displayName}`;editDepartment.value=user.department.code;for(const input of roleGrid.querySelectorAll('input'))input.checked=user.roles.includes(input.value);disable.hidden=user.status==='DISABLED';dialog.classList.add('show')}async function update(statusValue){const selected=[...roleGrid.querySelectorAll('input:checked')].map(input=>input.value);await BankOpsAuth.api(`/api/v1/admin/users/${editing.userId}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:statusValue,departmentCode:editDepartment.value,roles:selected})});dialog.classList.remove('show');await load()}refresh.onclick=load;statusFilter.onchange=load;departmentFilter.onchange=load;cancel.onclick=()=>dialog.classList.remove('show');save.onclick=()=>update('ACTIVE');disable.onclick=()=>update('DISABLED');init().catch(error=>list.textContent=`加载失败：${error.message}`);
</script></body></html>
