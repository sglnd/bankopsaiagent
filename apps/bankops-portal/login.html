<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · BankOps AI Agent</title>
<style>:root{color-scheme:dark;--line:rgba(255,255,255,.1);--muted:rgba(255,255,255,.55);--bad:#ffaaa2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#fff;background:#090909;font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0,rgba(103,153,254,.22),transparent 42%),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:auto,80px 80px,80px 80px;z-index:-1}.card{width:min(430px,calc(100% - 28px));padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.055);backdrop-filter:blur(20px);box-shadow:0 32px 100px #000}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(145deg,#6799fe,#8f77ff)}h1{margin:34px 0 7px;font-size:32px;letter-spacing:-.04em}p{margin:0 0 25px;color:var(--muted)}label{display:block;margin:14px 0 6px;color:rgba(255,255,255,.75);font-size:12px}input{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:11px;color:#fff;background:rgba(0,0,0,.3);outline:none}input:focus{border-color:#6799fe;box-shadow:0 0 0 3px rgba(103,153,254,.12)}button{width:100%;height:46px;margin-top:22px;border:0;border-radius:100px;background:#fff;color:#111;font-weight:700;cursor:pointer}.message{display:none;margin-top:14px;padding:10px;border:1px solid rgba(255,100,90,.25);border-radius:10px;color:var(--bad)}.foot{margin-top:22px;text-align:center;color:var(--muted)}a{color:#bcd1ff}</style></head>
<body><main class="card"><div class="brand"><span class="mark"></span>BankOps AI Agent</div><h1>欢迎回来</h1><p>登录信息科技部运维智能工作台。</p><form id="form"><label for="username">用户名</label><input id="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">登录</button><div class="message" id="message" role="status"></div></form><div class="foot">还没有账号？ <a href="/register">申请注册</a></div></main><script src="/auth-client.js"></script><script>
const form=document.getElementById('form'),message=document.getElementById('message');form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;message.style.display='none';try{await BankOpsAuth.api('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/'}catch(error){message.textContent=error.message;message.style.display='block'}finally{button.disabled=false}};
</script></body></html>
