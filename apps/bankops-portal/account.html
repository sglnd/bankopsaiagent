<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人账户 · BankOps</title><style>:root{color-scheme:dark;--line:rgba(255,255,255,.1);--muted:rgba(255,255,255,.52);--panel:rgba(255,255,255,.055);--good:#63d7a5;--bad:#ffaaa2}*{box-sizing:border-box}body{margin:0;color:#fff;background:#090909;font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(900px,calc(100% - 30px));margin:auto}header{border-bottom:1px solid var(--line)}nav{height:66px;display:flex;align-items:center;justify-content:space-between}.button{display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:0 14px;border:1px solid var(--line);border-radius:100px;color:#fff;background:var(--panel);cursor:pointer}main{padding:48px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{padding:25px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}h1{font-size:40px;margin:0 0 25px}h2{margin:0 0 18px}.avatar{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#2e4b80,#6955a9);font-size:20px;font-weight:700}.name{font-size:24px;margin:14px 0 3px}.meta{color:var(--muted)}.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.role{padding:4px 8px;border:1px solid var(--line);border-radius:100px;color:#bcd1ff;font-size:11px}label{display:block;margin:13px 0 5px;color:rgba(255,255,255,.75);font-size:12px}input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:#fff;background:#111}form .button{width:100%;margin-top:20px;background:#fff;color:#111;border:0;font-weight:700}.message{display:none;margin-top:13px;padding:10px;border:1px solid var(--line);border-radius:9px}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><header><nav class="shell"><b>BankOps AI Agent</b><div><a class="button" href="/">返回工作台</a> <button class="button" onclick="BankOpsAuth.logout()">退出</button></div></nav></header><main class="shell"><h1>个人账户</h1><div class="grid"><section class="card"><div class="avatar" data-user-avatar>--</div><div class="name" data-user-name>正在加载</div><div class="meta" id="username"></div><div class="meta" data-user-department></div><div class="roles" id="roles"></div></section><section class="card"><h2>修改密码</h2><p class="meta">修改后，除当前浏览器外的其他登录会话会立即失效。</p><form id="form"><label for="currentPassword">当前密码</label><input id="currentPassword" type="password" autocomplete="current-password" required><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="9" maxlength="128" required><p class="meta">至少 9 位，并在字母、数字、特殊字符中至少包含两类。</p><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="9" maxlength="128" required><button class="button" type="submit">更新密码</button><div class="message" id="message"></div></form></section></div></main><script src="/auth-client.js"></script><script>
const roleNames={PLATFORM_ADMIN:'平台管理员',DEPARTMENT_ADMIN:'团队管理员',OPERATOR:'运维人员',SECURITY_AUDITOR:'安全审计员',KNOWLEDGE_MANAGER:'知识管理员',SKILL_DEVELOPER:'Skill 开发者'},usernameNode=document.getElementById('username'),rolesNode=document.getElementById('roles'),formNode=document.getElementById('form'),messageNode=document.getElementById('message'),currentNode=document.getElementById('currentPassword'),newNode=document.getElementById('newPassword'),confirmNode=document.getElementById('confirmPassword');BankOpsAuth.me().then(user=>{usernameNode.textContent=`用户名：${user.username}`;rolesNode.replaceChildren(...user.roles.map(role=>{const node=document.createElement('span');node.className='role';node.textContent=roleNames[role]||role;return node}))});formNode.onsubmit=async event=>{event.preventDefault();messageNode.style.display='none';if(newNode.value!==confirmNode.value){messageNode.style.display='block';messageNode.style.color='var(--bad)';messageNode.textContent='两次输入的新密码不一致';return}const button=formNode.querySelector('button');button.disabled=true;try{await BankOpsAuth.api('/api/v1/auth/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({currentPassword:currentNode.value,newPassword:newNode.value})});formNode.reset();messageNode.style.display='block';messageNode.style.color='var(--good)';messageNode.textContent='密码已更新，其他登录会话已撤销。'}catch(error){messageNode.style.display='block';messageNode.style.color='var(--bad)';messageNode.textContent=error.message}finally{button.disabled=false}};
</script></body></html>
