<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · BankOps AI Agent</title>
<style>:root{color-scheme:dark;--line:rgba(255,255,255,.1);--muted:rgba(255,255,255,.55);--good:#63d7a5;--bad:#ffaaa2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px;color:#fff;background:#090909;font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0,rgba(143,119,255,.2),transparent 42%);z-index:-1}.card{width:min(520px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.055)}h1{margin:0 0 7px;font-size:32px}p{margin:0 0 22px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:13px 0 5px;font-size:12px;color:rgba(255,255,255,.74)}input,select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:#fff;background:#151515}button{width:100%;height:45px;margin-top:22px;border:0;border-radius:100px;background:#fff;color:#111;font-weight:700;cursor:pointer}.message{display:none;margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:10px}.foot{text-align:center;margin-top:19px;color:var(--muted)}a{color:#bcd1ff}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head>
<body><main class="card"><h1>申请工作台账号</h1><p>注册后需要平台管理员审批。请使用真实姓名并选择所属团队。</p><form id="form"><div class="row"><div><label for="username">用户名</label><input id="username" placeholder="例如 zhangsan" required pattern="[a-z][a-z0-9._-]{2,31}"></div><div><label for="displayName">姓名</label><input id="displayName" required minlength="2" maxlength="64"></div></div><label for="email">工作邮箱（可选）</label><input id="email" type="email"><label for="departmentCode">所属团队</label><select id="departmentCode" required><option>正在加载…</option></select><label for="password">密码</label><input id="password" type="password" autocomplete="new-password" required minlength="9" maxlength="128"><p style="margin:5px 0 0;font-size:11px">至少 9 位，并在字母、数字、特殊字符中至少包含两类。</p><button type="submit">提交注册申请</button><div class="message" id="message" role="status"></div></form><div class="foot"><a href="/login">返回登录</a></div></main><script src="/auth-client.js"></script><script>
const form=document.getElementById('form'),message=document.getElementById('message'),department=document.getElementById('departmentCode');BankOpsAuth.api('/api/v1/auth/departments').then(body=>{department.replaceChildren(...body.departments.map(item=>new Option(item.name,item.code))) }).catch(error=>{department.replaceChildren(new Option('团队加载失败',''));message.textContent=error.message;message.style.display='block'});form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const body=await BankOpsAuth.api('/api/v1/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,displayName:document.getElementById('displayName').value,email:document.getElementById('email').value,departmentCode:department.value,password:document.getElementById('password').value})});message.style.display='block';message.style.color='var(--good)';message.textContent=body.message;form.reset();setTimeout(()=>location.href='/login',1800)}catch(error){message.style.display='block';message.style.color='var(--bad)';message.textContent=error.message}finally{button.disabled=false}};
</script></body></html>
