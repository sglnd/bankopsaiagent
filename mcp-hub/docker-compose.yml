x-common: &common
  restart: unless-stopped
  networks:
    - bankops-network
  volumes:
    - ./workspace:/workspace
    - ./logs:/var/log/bankops
    - ./config:/config:ro

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.17.10}
    container_name: bankops-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - bankops-es-data:/usr/share/elasticsearch/data
    networks:
      - bankops-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  elasticsearch-seed:
    image: bankops/domain-mcp:local
    container_name: bankops-elasticsearch-seed
    restart: "no"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["node"]
    command: ["/seed/seed.js"]
    networks:
      - bankops-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  changeinfo-mcp:
    build:
      context: ./services/bankops-domain
      args:
        NODE_IMAGE: ${NODE_IMAGE}
    image: bankops/domain-mcp:local
    container_name: bankops-changeinfo-mcp
    restart: unless-stopped
    environment:
      BANKOPS_DOMAIN: changeinfo
      PORT: 8941
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${CHANGEINFO_PORT:-8941}:8941"
    networks:
      - bankops-network
    depends_on:
      elasticsearch-seed:
        condition: service_completed_successfully
    healthcheck: &domain-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  cmdb-mcp:
    image: bankops/domain-mcp:local
    container_name: bankops-cmdb-mcp
    restart: unless-stopped
    environment:
      BANKOPS_DOMAIN: cmdb
      PORT: 8942
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${CMDB_PORT:-8942}:8942"
    networks:
      - bankops-network
    depends_on:
      elasticsearch-seed:
        condition: service_completed_successfully
    healthcheck: *domain-healthcheck

  alertinfo-mcp:
    image: bankops/domain-mcp:local
    container_name: bankops-alertinfo-mcp
    restart: unless-stopped
    environment:
      BANKOPS_DOMAIN: alertinfo
      PORT: 8943
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${ALERTINFO_PORT:-8943}:8943"
    networks:
      - bankops-network
    depends_on:
      elasticsearch-seed:
        condition: service_completed_successfully
    healthcheck: *domain-healthcheck

  perfinfo-mcp:
    image: bankops/domain-mcp:local
    container_name: bankops-perfinfo-mcp
    restart: unless-stopped
    environment:
      BANKOPS_DOMAIN: perfinfo
      PORT: 8944
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${PERFINFO_PORT:-8944}:8944"
    networks:
      - bankops-network
    depends_on:
      elasticsearch-seed:
        condition: service_completed_successfully
    healthcheck: *domain-healthcheck

  playwright-mcp:
    <<: *common
    build:
      context: ./services/playwright
      args:
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE}
    image: bankops/playwright-mcp:local
    container_name: bankops-playwright-mcp
    ports:
      - "${PLAYWRIGHT_PORT}:8931"
    command: ["--host", "0.0.0.0", "--port", "8931", "--headless", "--browser", "chromium"]
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8931/mcp').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  filesystem-mcp:
    <<: *common
    build:
      context: ./services/filesystem
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        MCP_PROXY_VERSION: ${MCP_PROXY_VERSION}
    image: bankops/filesystem-mcp:local
    container_name: bankops-filesystem-mcp
    ports:
      - "${FILESYSTEM_PORT}:8932"
    command: ["mcp-proxy", "--port", "8932", "--", "mcp-server-filesystem", "/workspace"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8932/mcp').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  git-mcp:
    <<: *common
    build:
      context: ./services/git
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        MCP_PROXY_VERSION: ${MCP_PROXY_VERSION}
    image: bankops/git-mcp:local
    container_name: bankops-git-mcp
    ports:
      - "${GIT_PORT}:8933"
    command:
      - sh
      - -ec
      - |
        git config --global --add safe.directory /workspace
        if ! git -C /workspace rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          git -C /workspace init -q
          git -C /workspace symbolic-ref HEAD refs/heads/main
          git -C /workspace config user.name 'BankOps MCP'
          git -C /workspace config user.email 'bankops-mcp@localhost'
          git -C /workspace commit --allow-empty -m 'chore: initialize MCP workspace'
        fi
        exec mcp-proxy --port 8933 -- python3 -m mcp_server_git --repository /workspace
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8933/mcp').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  bankops-network:
    name: bankops-network
    driver: bridge

volumes:
  bankops-es-data:
    name: bankops-es-data
